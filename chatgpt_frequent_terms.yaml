  - "Leveraging complex datasets to extract meaningful insights"

# AIテキスト検出の手がかりとなる特徴
detection_hints:
  - 過度に複雑な文構造
  - カジュアルな文脈での不自然に形式的なトーン
  - 形式的な文脈での不自然にカジュアルなトーン
  - 不必要に長く冗長な表現
  - 曖昧で具体性に欠ける記述
  - 副詞の過剰使用